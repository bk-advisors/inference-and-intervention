project:
  type: website
  render:
    - index.qmd
    - schedule.qmd
    - r-setup.qmd
    - references.qmd
    - chapters/*.qmd
  resources:
    - course-intro/**
    - ch01-intro/**
    - ch02-qualitative-models/**
    - ch03-interview-case/**
    - ch04-quantitative-models/**
    - ch05-situational-analysis/**
    - ch06-simpsons-paradox/**
    - ch07-decision-analysis/**
    - ch08-resource-allocation/**
    - ch09-game-theory/**
    - ch10-structure-learning/**
  output-dir: _site

website:
  title: "Inference and Intervention"
  navbar:
    background: "#005CB9"
    foreground: "#ffffff"
    logo: course-intro/bka-logo.png
    left:
      - text: Home
        href: index.qmd
      - text: Course Intro
        href: course-intro/index.html
      - text: Schedule
        href: schedule.qmd
      - text: R Setup
        href: r-setup.qmd
      - text: References
        href: references.qmd
  sidebar:
    style: floating
    title: "Chapters"
    contents:
      - section: "Part 1: Draw the Picture"
        contents:
          - chapters/ch01.qmd
          - chapters/ch02.qmd
          - chapters/ch03.qmd
      - section: "Part 2: Add the Numbers"
        contents:
          - chapters/ch04.qmd
          - chapters/ch05.qmd
          - chapters/ch06.qmd
      - section: "Part 3: Make Decisions"
        contents:
          - chapters/ch07.qmd
          - chapters/ch08.qmd
          - chapters/ch09.qmd
          - chapters/ch10.qmd
  page-footer:
    center: "Inference and Intervention | BK Advisors"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap

execute:
  echo: true
  eval: false
  warning: false
